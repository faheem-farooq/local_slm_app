[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-slm-app"
version = "0.1.0"
description = "Local small-language-model inference, benchmarking, structured-output validation, and multi-model comparison, built on Ollama."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.13",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
local-slm = "local_slm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_slm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
