# Standardized prompt set (45 prompts, 15 per task type) reused across:
#   Phase 1 - inference benchmarking (all prompts, task-agnostic)
#   Phase 2 - JSON schema validation + retry (json_extraction subset) and
#             temperature experiment (all prompts)
#   Phase 3 - three-model quality comparison (all prompts, scored per task_type)
#
# task_type: factual_qa | summarization | json_extraction
# json_extraction.schema_name must match a class in structured/schemas_catalog.SCHEMA_REGISTRY

