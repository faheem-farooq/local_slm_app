- id: summ_01
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Photosynthesis is the process by which green plants, algae, and some bacteria convert
    light energy into chemical energy. Using sunlight, water, and carbon dioxide, these
    organisms produce glucose and release oxygen as a byproduct. This process takes place
    primarily in the chloroplasts of plant cells, which contain the pigment chlorophyll.
    Photosynthesis is the foundation of most food chains on Earth and is responsible for
    producing the oxygen that most living organisms depend on to survive.
  expected_keywords: ["photosynthesis", "light energy", "chlorophyll", "oxygen", "glucose"]

- id: summ_02
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Honeybees live in highly organized colonies made up of a single queen, thousands of
    female worker bees, and a smaller number of male drones. Worker bees forage for nectar
    and pollen, communicating the location of food sources to each other through a
    movement pattern known as the waggle dance. Bees play a critical role in pollinating
    many of the crops humans rely on for food, making them essential to global agriculture.
  expected_keywords: ["honeybees", "colony", "queen", "pollination", "waggle dance"]

- id: summ_03
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    The water cycle describes the continuous movement of water on, above, and below the
    surface of the Earth. Water evaporates from oceans, lakes, and rivers, rises into the
    atmosphere, and cools to form clouds through condensation. Eventually the water falls
    back to Earth as precipitation, such as rain or snow, and either flows into bodies of
    water or seeps into the ground, restarting the cycle.
  expected_keywords: ["water cycle", "evaporation", "condensation", "precipitation"]

- id: summ_04
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Machine learning is a branch of artificial intelligence in which computer systems
    learn patterns from data rather than following explicit, hand-written rules. A model
    is trained on a dataset, adjusting its internal parameters to minimize prediction
    error, and can then be applied to new, unseen data. Common applications include image
    recognition, language translation, and recommendation systems used by many online
    platforms.
  expected_keywords: ["machine learning", "artificial intelligence", "data", "model", "training"]

- id: summ_05
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    The Great Barrier Reef, located off the coast of Queensland, Australia, is the
    world's largest coral reef system, stretching over 2,300 kilometers. It is home to
    thousands of species of marine life, including fish, mollusks, and sea turtles.
    Rising ocean temperatures linked to climate change have caused repeated mass coral
    bleaching events, threatening the long-term survival of the reef's ecosystem.
  expected_keywords: ["Great Barrier Reef", "coral", "Australia", "climate change", "bleaching"]

- id: summ_06
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    The printing press, invented by Johannes Gutenberg around 1440, revolutionized the
    spread of written information across Europe. Before its invention, books were copied
    by hand, a slow and expensive process that limited literacy to a small elite. The
    printing press allowed texts to be reproduced quickly and cheaply, fueling the spread
    of literacy, scientific ideas, and eventually the Protestant Reformation.
  expected_keywords: ["printing press", "Gutenberg", "literacy", "books"]

- id: summ_07
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    A black hole is a region of space where gravity is so strong that nothing, not even
    light, can escape once it crosses a boundary called the event horizon. Black holes
    form when massive stars collapse at the end of their life cycle. Although they cannot
    be observed directly, astronomers detect black holes by studying their gravitational
    effects on nearby stars and gas, and by capturing images of the glowing matter that
    swirls around them.
  expected_keywords: ["black hole", "gravity", "event horizon", "star"]

- id: summ_08
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Ancient Roman aqueducts were engineering marvels that transported fresh water from
    distant sources into cities and towns, using gravity to move water along a slight,
    consistent downward slope. Some aqueducts ran underground, while others were carried
    above ground on tall stone arches. This infrastructure supplied public baths,
    fountains, and private homes, and supported the growth of large urban populations
    throughout the Roman Empire.
  expected_keywords: ["aqueducts", "Roman", "water", "gravity"]

- id: summ_09
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Vaccines work by training the immune system to recognize and fight specific
    pathogens, such as viruses or bacteria, without causing the disease itself. They
    typically contain a weakened or inactivated form of the pathogen, or a harmless piece
    of it, which triggers the production of antibodies. If the vaccinated person is later
    exposed to the real pathogen, their immune system can respond quickly, often
    preventing illness or reducing its severity.
  expected_keywords: ["vaccines", "immune system", "antibodies", "pathogen"]

- id: summ_10
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    The stock market is a collection of exchanges where shares of publicly traded
    companies are bought and sold. Prices are determined by supply and demand, which are
    influenced by factors such as company earnings, economic indicators, and investor
    sentiment. Investors buy stocks hoping their value will rise over time, while
    companies use stock markets to raise capital by selling ownership stakes to the
    public.
  expected_keywords: ["stock market", "shares", "companies", "supply and demand"]

- id: summ_11
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    The French Revolution, beginning in 1789, was a period of radical social and
    political upheaval in France that overthrew the monarchy and led to the rise of
    republicanism. Widespread economic hardship, food shortages, and resentment toward
    the aristocracy fueled popular uprisings. The revolution introduced ideas about
    liberty, equality, and citizenship that influenced political movements across the
    world for centuries afterward.
  expected_keywords: ["French Revolution", "monarchy", "1789", "liberty"]

- id: summ_12
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Solar panels convert sunlight directly into electricity using photovoltaic cells made
    from semiconductor materials, typically silicon. When sunlight strikes these cells, it
    excites electrons and generates an electric current. Solar power is considered a
    renewable energy source because it does not deplete natural resources or produce
    direct emissions during operation, making it an increasingly popular alternative to
    fossil fuels.
  expected_keywords: ["solar panels", "electricity", "photovoltaic", "renewable"]

- id: summ_13
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    The human immune system is a complex network of cells, tissues, and organs that work
    together to defend the body against harmful pathogens. White blood cells identify and
    destroy invaders, while the lymphatic system helps transport immune cells throughout
    the body. A well-functioning immune system can distinguish between the body's own
    cells and foreign invaders, though this process can sometimes malfunction and cause
    autoimmune disease.
  expected_keywords: ["immune system", "white blood cells", "pathogens"]

- id: summ_14
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Plate tectonics is the scientific theory that Earth's outer shell is divided into
    several large, rigid plates that float and move atop the semi-fluid mantle beneath
    them. The movement and interaction of these plates, whether colliding, pulling apart,
    or sliding past one another, is responsible for earthquakes, volcanic activity, and
    the formation of mountain ranges over millions of years.
  expected_keywords: ["plate tectonics", "earthquakes", "mantle", "volcanic"]

- id: summ_15
  task_type: summarization
  prompt: >
    Summarize the following text in 1-2 sentences:

    Coral bleaching occurs when corals, stressed by changes such as elevated ocean
    temperatures, expel the colorful algae living in their tissues, causing them to turn
    white. Without these algae, which provide corals with food and much of their color,
    coral can starve and become more vulnerable to disease. If stressful conditions
    persist for too long, bleached coral reefs can die, reducing biodiversity and
    threatening the marine life that depends on them.
  expected_keywords: ["coral bleaching", "algae", "ocean temperature", "reef"]

